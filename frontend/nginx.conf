server {
    listen 4200;
    server_name localhost;

    # This needs to point all requests to index.html, since Angular projects
    # are single page applications, so that reloading the page while under some
    # path (e.g. "localhost/articles/abc") won't result in the nginx 404 error.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # These files tell the browser and the service worker which version of the
    # app is the latest, so they must always be revalidated. Otherwise users
    # may keep getting the old version after a deploy.
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
